# DONT USE IT OR REGRET IT ITS IN BETA MODE AND NOT READY FOR PRODUCTION
# ═══════════════════════════════════════════════════════════════
# CROSS-SERVER SYSTEM (Limbo)
# Set enabled: true to activate multi-server mode.
# Requires Redis and MySQL when enabled.
# When disabled, the plugin works in single-server local mode using H2.
# ═══════════════════════════════════════════════════════════════
cross_server:
  enabled: false

  server-name: "lobby-1"
  server-type: LOBBY  # LOBBY, ARENA, TOURNAMENT, EVENT

  redis:
    host: "localhost"
    port: 6379
    password: ""
    timeout: 3000
    max-pool-size: 16
    channel-prefix: "flixcore"

  mysql:
    host: "localhost"
    port: 3306
    database: "flixcore"
    username: "root"
    password: ""
    max-pool-size: 15
    min-idle: 3

  heartbeat:
    interval: 5
    timeout: 15

  transfer:
    # Transfers use Velocity's backend plugin messaging connect request.
    # Keep server-name values identical to the server names in velocity.toml.
    # host/port are still published in heartbeats for monitoring, but are not used for player transfer.
    host: ""
    port: 25565
    retry-on-failure: true
    retry-delay: 2
    max-retries: 3
    timeout: 10

  match-transfer:
    # Large groups receive additional time for sequential proxy connections.
    arrival-base-timeout-seconds: 10
    arrival-per-player-seconds: 2
    arrival-max-timeout-seconds: 120

  fallback:
    enabled: true
    lobby-priority: []

  global-tab:
    enabled: true
    update-interval: 3

  friends:
    cross-server-messaging: true
    join-notifications: true
    switch-notifications: true

  monitoring:
    enabled: true
    permission: "flixcore.monitor"
