# Ranked queue settings.
# This system only affects ranked queue matches, not normal duels, unranked queue, party, or FFA.
# Players have two ratings:
# - Per-kit ELO: separate rating for each ranked kit.
# - Global ELO: display rating calculated from the average of all configured per-kit ELOs.
# The ranked database stores global ranked wins/losses/matches, while the displayed ELO comes from kit averages.
# Matchmaking uses the average of displayed global ELO and selected kit ELO to find fair opponents.
ranked:
  # Legacy fixed ELO values kept for compatibility. Ranked match results now use the advanced ELO settings below.
  elo-per-win: 12
  elo-per-loss: 12
  permission-win-bonus:
    enabled: true
    # Apply the permission bonus to the stored global ranked ELO.
    apply-to-global: true
    # Apply the permission bonus to the selected kit's ranked ELO.
    apply-to-kit: true
    # If false, only the highest matching bonus is used. If true, all matching bonuses are added together.
    stack-bonuses: false
    bonuses:
      vip:
        permission: flixcore.elo.vip
        bonus: 5
  sounds:
    tier-up: UI_TOAST_CHALLENGE_COMPLETE
    tier-up-volume: 1.0
    tier-up-pitch: 1.2
    tier-down: ENTITY_VILLAGER_NO
    tier-down-volume: 1.0
    tier-down-pitch: 0.8
  # Number of rounds used for ranked matches.
  rounds: 1
  # First ranked matches used to place a player. Placement matches use placement-k-factor for faster rating adjustment.
  placement-matches: 5
  streak-points:
    # Extra points added to a ranked win once the player's ranked win streak reaches this minimum.
    win-streak-extra-point: 2
    minimum-win-streak-needed: 5
    # Extra points removed on a ranked loss once the player's ranked lose streak reaches this minimum.
    lose-streak-extra-loss: 2
    minimum-lose-streak-needed: 5
  elo:
    # Normal ELO sensitivity after placements. Higher = faster gain/loss.
    k-factor: 32
    # ELO sensitivity during placement matches. Usually higher than normal k-factor.
    placement-k-factor: 48
    # Minimum ELO a winner can gain, even against weaker opponents.
    min-gain: 4
    # Maximum ELO a winner can gain, usually when beating a much stronger opponent.
    max-gain: 40
    # Minimum ELO a loser can lose, usually when losing against a much stronger opponent.
    min-loss: 4
    # Maximum ELO a loser can lose, usually when losing against a much weaker opponent.
    max-loss: 40
  elo-history:
    # Number of days to keep ranked ELO event history for API summaries.
    retention-days: 30
  matchmaking:
    # Starting ELO difference allowed when searching for an opponent.
    # Example: 1000 ELO with 150 range can match 850-1150.
    search-range-start: 150
    # How much the allowed ELO range expands per second while waiting in queue.
    search-range-expand-per-second: 4
    # Maximum ELO difference allowed. Lower value makes high-vs-low ELO matches more rare.
    search-range-max: 450
  tiers:
    silver1:
      min: 0
    silver2:
      min: 901
    silver3:
      min: 931
    gold1:
      min: 951
    gold2:
      min: 1001
    gold3:
      min: 1051
    platinum1:
      min: 1101
    platinum2:
      min: 1201
    platinum3:
      min: 1301
    diamond1:
      min: 1401
    diamond2:
      min: 1501
    diamond3:
      min: 1601
    master:
      min: 1701
    grandmaster:
      min: 2001
    lt5:
      min: 1000
    ht5:
