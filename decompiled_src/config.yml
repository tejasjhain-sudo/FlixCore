# ═══════════════════════════════════════════════════════════════
# Clan Configuration
# ═══════════════════════════════════════════════════════════════
# Clans persist to the database automatically.
# Players can /clan create <name>, invite, join, leave, chat, etc.
# Clans can participate in clan-type tournaments.
#
# Placeholders:
#   %flixcore_clan_name%       - Player's clan name
#   %flixcore_clan_tag%        - Colored [ClanName] tag
#   %flixcore_clan_points%     - Player's clan points
#   %flixcore_clan_members%    - Member count
#   %flixcore_clan_leader%     - Clan leader name
#   %flixcore_clan_top_name_1% - #1 clan by points (1-10)
#   %flixcore_clan_top_points_1% - #1 clan's points
#   %flixcore_has_clan%        - true/false
#   %flixcore_clan_count%      - Total clans on server
# ═══════════════════════════════════════════════════════════════
clans:
  # Requires a restart. When false, no clan manager, database tasks, commands,
  # listeners, GUI, tags, points, or clan tournaments are registered.
  enabled: true
  max-members: 15
  invite-expire-time: 60  # seconds before invite expires
  description-max-length: 120
  tags:
    enabled: true
    ffa-only: true
    format: '&8[&e%tag%&8]&r '
    tab-visible: true
    min-length: 2
    max-length: 5
  relationships:
    request-expire-seconds: 300
    max-allies: 5
    max-rivals: 5
  # Clan names are checked case-insensitively after colors/symbols are stripped.
  restricted-names:
    - admin
    - owner
    - staff
    - mod
    - moderator
    - helper
    - flixcore
    - server
  # Java regex patterns. Useful for blocking names that contain staff/admin words.
  restricted-patterns:
    - ".*admin.*"
    - ".*staff.*"
    - ".*owner.*"
  points:
    enabled: true
    top-cache-seconds: 30
    duel-win:
      enabled: true
      amount: 10
    duel-kill:
      enabled: false
      amount: 2
    ffa-kill:
      enabled: true
      amount: 3
    party-win:
      enabled: true
      amount: 5
    tournament-win:
      first: 50
      second: 25
      third: 10

# ═══════════════════════════════════════════════════════════════
# Tournament Configuration
# ═══════════════════════════════════════════════════════════════
# Bracket-style elimination tournaments.
# Tournament matches are 1v1 duels using the DuelManager system.
# Arenas marked as EVENT (/arena event <name>) are used first.
# If no event arenas are available, regular arenas for the kit are used.
#
# SETUP REQUIREMENTS:
#   1. Create arenas: /arena create <name>
#   2. Set positions: /arena pos1 <name>, /arena pos2 <name> (spawn points)
#   3. Set bounds: /arena centre <name>, /arena corner1 <name>, /arena corner2 <name>
#   4. Assign kit: /arena kits <name> <kit>
#   5. Mark as event arena: /arena event <name>
#      ↳ Event-enabled arenas are RESERVED for tournaments & events only
#      ↳ They will NOT be used for regular duels or queue matches
#      ↳ If no event arenas exist, tournament falls back to regular arenas
#   6. Make sure arena type matches kit type (BUILD or NON_BUILD)
#   7. For BUILD arenas: set corner1/corner2 so schematic reset works
#
# PERMISSIONS:
#   flixcore.tournament.host - Required to host/start/stop (default: op)
#   flixcore.tournament.join - Required to join (default: true)
#
# HOW IT WORKS:
#   - Host creates tournament: /tournament host <kit> <maxplayers> [SOLO|PARTY|CLAN]
#   - Players join with: /tournament join
#   - Players are teleported to lobby and given "tournament" spawn items
#   - Tab list only shows tournament participants
#   - Each round, players are paired and fight in available event arenas
#   - If no event arenas available, falls back to regular arenas for the kit
#   - After each fight, arena resets automatically (BUILD=schematic, NON_BUILD=entity cleanup)
#   - Kit rules are fully enforced during each fight (hunger, regen, etc.)
#   - Winners advance; losers are eliminated and sent to lobby
#   - Last player standing wins the tournament
#   - Players CANNOT join after the tournament has started
#   - Players CANNOT queue, duel, join FFA, spectate, or join events while in tournament
#
# COMMANDS:
#   /tournament host <kit> <maxplayers> [SOLO|PARTY|CLAN] - Host a tournament
#   /tournament join    - Join the active tournament
#   /tournament leave   - Leave the tournament
#   /tournament start   - Force start the tournament
#   /tournament stop    - Cancel the tournament
#   /tournament status  - View tournament info
#
# Placeholders:
#   %flixcore_tournament_kit%    - Active tournament kit
#   %flixcore_tournament_type%   - SOLO/PARTY/CLAN
#   %flixcore_tournament_round%  - Current round number
#   %flixcore_tournament_alive%  - Remaining players
#   %flixcore_tournament_state%  - WAITING/STARTING/IN_PROGRESS/ENDED
#   %flixcore_in_tournament%     - true/false
#
# Scoreboard: Uses the "tournament" scoreboard state in scoreboard.yml
# Spawn Items: Uses the "tournament" state in spawnitems.yml
# ═══════════════════════════════════════════════════════════════
tournament:
  default-max-players: 32
  countdown-time: 60  # seconds after forcestart before round 1
  match-delay-ticks: 100
  end-delay-ticks: 100
  sounds:
    win: "ENTITY_PLAYER_LEVELUP"
    win-volume: 1.0
    win-pitch: 1.0

  # ─── Winner Rewards ───
  # Commands executed when tournament ends. Use %player% for winner name.
  # Commands are run from CONSOLE (no / prefix needed).
  rewards:
    enabled: true
    first:
      - "eco give %player% 1000"
      - "give %player% diamond 5"
    second:
      - "eco give %player% 500"
      - "give %player% gold_ingot 10"
    third:
      - "eco give %player% 250"

  # ─── Auto-Host Configuration ───
  # Automatically hosts tournaments on a repeating schedule.
  # The system will rotate through the configured kits in order.
  # If a tournament fails to start (not enough players, no arenas, etc.),
  # the reason is broadcast to all online players.
  auto-host:
    enabled: false
    # Interval between tournaments in minutes (time after one ends before next is announced)
    interval: 30
    # How long players have to join before the tournament auto-starts (seconds)
    join-time: 120
    # Minimum players required to start — if not met, tournament is cancelled with reason
    min-players: 4
    # Maximum players per auto-hosted tournament
    max-players: 32
    # Tournament type: SOLO, PARTY, or CLAN
    type: SOLO
    # Kit rotation list — cycles through these kits in order
    # If a kit doesn't exist or has no arenas, it skips to the next one
    kits:
      - "nodebuff"
      - "diamond"
      - "combo"
    # Whether to broadcast announcements to all players
    broadcast-announcements: true
    # How often to send reminder broadcasts during join phase (seconds, 0 = no reminders)
    reminder-interval: 30

# ═══════════════════════════════════════════════════════════════
# Event Configuration
# ═══════════════════════════════════════════════════════════════
# Staff/player-hosted minigame events (Sumo, Spleef, TNT Run, Gulag, Brackets).
# Events use a SPECIFIC arena — the host picks which arena to use.
# The arena is reserved (IN_USE) for the entire event duration,
# then reset and freed when the event ends.
#
# SETUP REQUIREMENTS:
#   1. Create dedicated event arenas: /arena create sumo1
#   2. Set pos1 and pos2 (player spawn points for 1v1 fights)
#   3. Set centre (waiting area / winner teleport point between fights)
#   4. Set corner1, corner2 (bounding box for arena reset)
#   5. Mark as event arena: /arena event sumo1
#      ↳ REQUIRED! Only event-enabled arenas can be used for events
#      ↳ Tab-complete for /event host only shows event arenas
#   6. For BUILD arenas (Spleef, TNT Run): set corner1/corner2 for schematic reset
#   7. For NON_BUILD arenas (Sumo, Gulag, Brackets): entities auto-cleanup
#   8. Arena MUST be AVAILABLE when hosting (not used by another match)
#
# PERMISSIONS:
#   flixcore.event.host - Required to host/start/cancel (default: op)
#   flixcore.event.join - Required to join (default: true)
#
# HOW IT WORKS:
#   - Host creates event: /event host <arena> <maxplayers> <kit>
#   - The event type is inferred from kit rules; the old explicit-type syntax remains supported
#   - The specified event arena is reserved immediately (state → IN_USE)
#   - Players join with: /event join → teleported to arena centre
#   - Players receive "event" spawn items and EVENT scoreboard state
#   - Tab list only shows event participants + current fighters
#   - When started, players fight 1v1 in the reserved arena
#   - Fighters receive the specified kit and kit rules are enforced
#   - Fighters spawn at pos1 and pos2 of the arena
#   - Losers are eliminated and sent to lobby with default spawn items
#   - Winners teleport back to centre and wait for next fight
#   - Last player standing wins
#   - Match history is saved for each fight (winner/loser/kit/arena)
#   - Arena is reset and freed after event ends
#   - Players CANNOT join after the event has started
#   - Players CANNOT queue, duel, join FFA, spectate, or join tournaments while in event
#   - Players are spread in a circle around arena centre when joining
#
# COMMANDS:
#   /event host <arena> <maxplayers> <kit> - Host an event and infer its type
#   /event host <type> <arena> <maxplayers> <kit> - Host with an explicit type
#   /event join     - Join the active event
#   /event leave    - Leave the event
#   /event start    - Force start the event
#   /event cancel   - Cancel the event
#   /event info     - View event info
#
# EVENT TYPES:
#   SUMO      - No items, knockback-only (fall = lose)
#   SPLEEF    - Diamond shovel, break blocks under opponents
#   TNT_RUN   - Run on platforms that break behind you
#   GULAG     - Wooden sword 1v1
#   BRACKETS  - Standard bracket fights (no special items)
#
# Placeholders:
#   %flixcore_event_type%   - SUMO/SPLEEF/TNT_RUN/GULAG/BRACKETS
#   %flixcore_event_arena%  - Arena name being used
#   %flixcore_event_alive%  - Remaining players
#   %flixcore_event_state%  - WAITING/STARTING/IN_PROGRESS/ENDED
#   %flixcore_in_event%     - true/false
#
# Scoreboard: Uses the "event" scoreboard state in scoreboard.yml
# Spawn Items: Uses the "event" state in spawnitems.yml
# ═══════════════════════════════════════════════════════════════
events:
  default-max-players: 24
  countdown-time: 60  # seconds after forcestart before fights begin

# ═══════════════════════════════════════════════════════════════
# Match History Configuration
# ═══════════════════════════════════════════════════════════════
# Stores match results (winner, loser, kit, arena, date) in the
# database and provides a browsable paginated GUI per player.
#
# COMMANDS:
#   /matchhistory [player]  - View your or another player's match history
#   Aliases: /matches, /mh
#
# PERMISSIONS:
#   flixcore.matchhistory  - Allows viewing match history (default: true)
#
# HOW IT WORKS:
#   - Every duel/ranked match result is auto-saved to the database
#   - Last 30 matches per player are cached in memory
#   - GUI is fully configurable in menus/matchhistory.yml
#   - Wins shown as green, losses as red
#   - Each item shows opponent, kit, arena, date, ranked/unranked
#
# GUI PLACEHOLDERS (in menus/matchhistory.yml):
#   %opponent% - Opponent name
#   %kit%      - Kit used
#   %arena%    - Arena name
#   %date%     - Match date
#   %ranked%   - Ranked or Unranked
#   %result%   - Win or Loss
#   %player%   - Target player name (in title)
# ═══════════════════════════════════════════════════════════════
match-history:
  cached-records: 30

kit-statistics:
  # Tracks total match counts per kit asynchronously in the database.
  enabled: true
  # Number of kits shown per /kitstats top page.
  command-page-size: 10

api:
  enabled: false
  port: 8080
  api-key: "change-me-to-a-secure-key"
  rate-limit: 60
  cors-origin: "*"

