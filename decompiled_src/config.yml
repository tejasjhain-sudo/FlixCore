license-key: "YOUR_LICENSE_KEY_HERE"

# Enable verbose plugin debug logs (kit editor diagnostics, race-condition tracing, etc).
# Turn this on temporarily if players report being unable to move items in the kit editor
# or other state issues — the console will explain which listener cancelled the action.
debug: false

disabled-worlds:
  - "example_world"

arena-lobby-loaded: false

lobby:
  world: "world"
  x: 0.5
  y: 65.0
  z: 0.5
  yaw: 0.0
  pitch: 0.0

prefix: "&#0091EA[&#00E5FFFlixCore&#0091EA] &r"

gui:
  duel-gui-enabled: true
  # If true, right-clicking a lobby player opens the duel kit selection GUI.
  # Set false to disable only this shortcut; /duel and other duel GUI flows still work.
  right-click-player-duel-gui-enabled: false
  queue-gui-enabled: true
  mode-gui-enabled: true
  ranked-kit-gui-enabled: true
  ranked-queue-gui-enabled: true
  # Paper Dialogs duel settings UI (1.21.7+ clients/servers).
  # If enabled and supported, the rounds/settings step uses a modern dialog.
  # If disabled or unavailable, FlixCore uses menus/rounds.yml like before.
  duel-dialog:
    enabled: false
    title: "&6Duel Settings"
    body:
      - "&7%sender% &fvs &7%target%"
      - "&7Kit: &e%kit%"
    rounds-label: "Rounds"
    # Paper Dialog label format receives two values: %s = label, %2$s = selected number.
    # Use %2$s when you want only the live round number.
    rounds-format: "Rounds: %2$s"
    slider-width: 310
    initial-rounds: 1
    send-button: "&aSend Duel"
    # Button tooltips are static in Paper dialogs; the live selected number is shown by rounds-format.
    send-tooltip: "&7Send a duel request with the selected rounds."
    close-button: "&cClose"
    close-tooltip: "&7Close without sending a duel request."
    advanced-button:
      enabled: true
      text: "&7View Advanced Options"
      tooltip: "&7Open the classic rounds menu."

bot:
  # Kits listed here cannot be used with /bot and are hidden from its tab completion.
  # Matching is case-insensitive. Apply changes with /flixcore reload config.
  # Example: disabled-kits: [nodebuff, boxing]
  disabled-kits: []

match:
  # Delay after a non-final round death before players are teleported back
  # to their starting positions for the next round countdown.
  next-round-delay-seconds: 3
  round-score-title:
    enabled: true
    # Keep false so the final victory/defeat title is not overwritten.
    show-final-round: false
    # Delay allows the round victory/defeat title to display first.
    delay-ticks: 20
    title: "&eRound Score: &f%player1_wins% &7- &f%player2_wins%"
    subtitle: "&f%player1% &8vs &f%player2%"
    fade-in-ticks: 0
    stay-ticks: 30
    fade-out-ticks: 10
    # Available placeholders:
    # %player1%, %player2%, %player1_wins%, %player2_wins%,
    # %your_wins%, %opponent_wins%, %winner%, %round%, %total_rounds%
  leave-delay:
    enabled: true
    seconds: 3
    title: "&c&lDEFEAT"
    subtitle: "&7Teleporting to lobby..."
    fade-in-ticks: 5
    stay-ticks: 40
    fade-out-ticks: 10
    sound: "ENTITY_VILLAGER_DEATH"
    sound-volume: 1.0
    sound-pitch: 1.0
  inactivity-reveal:
    enabled: true
    seconds: 60
    message: "&e%opponent% &7is at &f%x%&7, &f%y%&7, &f%z%"
    sound: "BLOCK_NOTE_BLOCK_BELL"
    sound-volume: 1.0
    sound-pitch: 1.0
  countdown-time: 4
  # How long players remain in the arena after the final win. Final
  # victory/defeat titles and sounds play immediately, before this delay.
  spectator-time: 5
  crafting-in-fight: false
  inv-see:
    enabled: true
    # Cross-server snapshots are bounded and automatically expire in Redis.
    redis-ttl-seconds: 300
    redis-max-bytes: 262144
    click-text: "&#FFD54F⏵ [ &nᴠɪᴇᴡ ɪɴᴠ&#FFD54F ] ⏴"
    hover-text: "&#FFD54F🔍 &#FFFFF0Click to see %opponent%'s inventory"
    gui-title: "&#FFB800%opponent%'s Inventory"
  bed-status:
    alive: "✅"
    destroyed: "❌"
  kit-colored-armor: true
  max-fight-duration: 30
  duel-max-rounds: 20
  queue-default-rounds:
    # Default round amount for unranked queue matches. Per-kit keys are normal kit names.
    unranked:
      default: 1
      kits:
        # nodebuff: 3
    # Default round amount for ranked queue matches. Per-kit keys can be normal kit names or tier kit names.
    ranked:
      default: 1
      kits:
        # nodebuff: 3
        # tiernodebuff: 3
  duel-request-expiry: 60
  start-elevator:
    enabled: false
    radius: 1
    depth: 5
    sync-with-countdown: true
    duration-ticks: 60
    levitation-amplifier: 1
    platform-offset: 0.5
    platform-material: IRON_BLOCK
    # Smooth mode uses client-side BlockDisplay interpolation and ease-in-out movement.
    # Higher update-interval reduces server work; interpolation keeps the platform moving smoothly.
    smooth: true
    update-interval: 2
    teleport-duration: 3
    easing: "ease-in-out"
    teleport-to-spawn-on-finish: false
    # Real blocks restore one horizontal layer whenever the platform rises one
    # full block: depth 5 restores 5, 4, 3, 2, 1 from bottom to top. The spawn
    # Y layer is restored last before levitation/display cleanup.
    # Extra levitation/cleanup safety time retained for slow FAWE servers.
    restore-before-finish-ticks: 20
    # If layer restoration is slow, verify the area and queue one full backup paste.
    restore-timeout-ticks: 40
    sound: BLOCK_PISTON_EXTEND
    sound-volume: 1.0
    sound-pitch: 1.0
    # Normal names also disable generated ranked forms automatically
    # (for example, bedwars also disables tierbedwars).
    disabled-kits:
      - nodebuff
      - boxing
      - sumo
      - thebridge
      - bedwars
      - blockdecay
      - bedboom
      - creeper
      - hunt
      - colour
      - pilleroffortune
  round-rewind:
    enabled: false
    # Maximum ballistic flight time; a shorter duration may be selected
    # automatically to match the configured arc height.
    duration-ticks: 60
    # Approximate peak blocks above the direct path.
    arc-height: 4.0
    particles: true
    # Normal names also disable generated ranked forms automatically.
    disabled-kits:
      - nodebuff
      - boxing
      - sumo
      - thebridge
      - bedwars
      - blockdecay
      - bedboom
      - creeper
      - hunt
      - colour
      - pilleroffortune
  # First-To win condition (FT)
  # If true: a duel/party match ends as soon as a player or team reaches the chosen rounds value as their win count
  #         (e.g. rounds=5 -> first to 5 wins takes the match).
  # If false (default): classic best-of-N (e.g. rounds=5 -> first to 3 wins).
  # Applies to: duel requests, ranked queue, party FFA / split / vs-party.
  first-to: false
  titles:
    - title: ""
      subtitle: "&e➌"
      pitch: 0.8
    - title: ""
      subtitle: "&e➋"
      pitch: 1.0
    - title: ""
      subtitle: "&e➊"
      pitch: 1.2
  final-title:
    - title: ""
      subtitle: "&e🏆 &6Fight &e🏆"
  disabled-commands:
    - '/duel'
    - '/sc'
    - '/flixcore'
  sounds:
    # Every scalar sound supports sibling -volume (minimum 0) and -pitch (0.5-2.0).
    countdown: "BLOCK_NOTE_BLOCK_PLING"
    countdown-volume: 1.0
    countdown-pitch: 1.0
    start: "BLOCK_NOTE_BLOCK_CHIME"
    start-volume: 1.0
    start-pitch: 1.0
    win: "ENTITY_PLAYER_LEVELUP"
    win-volume: 1.0
    win-pitch: 1.0
    lose: "ENTITY_VILLAGER_DEATH"
    lose-volume: 1.0
    lose-pitch: 1.0
  kill-sound: "ENTITY_EXPERIENCE_ORB_PICKUP"
  kill-sound-volume: 1.0
  kill-sound-pitch: 1.0
  match-found:
    enabled: true
    instant-queue: false
    blindness: true
    blindness-duration: 100
    # Ticks to wait after "match found" before teleporting/starting match setup.
    # teleport-delay has priority, start-delay is kept as an alias, delay is legacy fallback.
    teleport-delay: 60
    start-delay: 60
    delay: 60
    title: "&6&lMATCH FOUND"
    subtitle: "&eGet ready to fight!"
    sound: "ENTITY_EXPERIENCE_ORB_PICKUP"
    sound-volume: 1.0
    sound-pitch: 1.0
    queue-join-actionbar:
      enabled: true
      message: "%kit_sprite% &#FFD54F⚔ &#FFFFF0Searching for match... Kit: &#FFD54F%kit% &#FFFFF0| &#FFD54F%time%"
    match-found-actionbar:
      enabled: true
      message: "%kit_sprite% &#8AFF80✔ &#FFFFF0Match found! Opponent: &#FFD54F%opponent% &#FFFFF0| Kit: &#FFD54F%kit%"
    totem-animation:
      enabled: true
      show-title: true
      sound: "ITEM_TOTEM_USE"
      sound-volume: 1.0
      sound-pitch: 1.0
      item: "TOTEM_OF_UNDYING"
      # Per-kit sound-volume/sound-pitch inherit the global values when omitted.
      # Normal and ranked names are linked automatically:
      # configuring "bedwars" also applies to "tierbedwars" (and vice versa).
      # kits:
      #   diamond:
      #     sound: "ENTITY_ENDER_DRAGON_GROWL"
      #     sound-volume: 1.0
      #     sound-pitch: 1.0
      #     item: "DIAMOND_SWORD"
      #   nodebuff:
      #     sound: "ENTITY_WITHER_SPAWN"
      #     item: "SPLASH_POTION"
    door-animation:
      enabled: false
      front-only-rise: true
      red-block: "RED_STAINED_GLASS"
      blue-block: "BLUE_STAINED_GLASS"
      red-top-block: "RED_STAINED_GLASS"
      blue-top-block: "BLUE_STAINED_GLASS"
      red-side-block: "RED_STAINED_GLASS"
      blue-side-block: "BLUE_STAINED_GLASS"
      width: 5
      height: 3
      depth: 3
      rise-duration: 40
      disabled-kits:
        - sumo
        - boxing

# Free For All Configuration
free-for-all:
  rejoin-automatically: true
  ffa-countdown: 4
  # Cross-server joins reserve an instance slot atomically in Redis before transfer.
  # A limit of 0 is unlimited. Per-instance names are FlixCore arena names.
  instances:
    default-limit: 100
    limits:
      # nodebuff-ffa-1: 60
      # nodebuff-ffa-2: 80
    reservation-ttl-seconds: 20
    # Count snapshots and active memberships expire if a server stops refreshing them.
    count-ttl-seconds: 20
  titles:
    - title: ""
      subtitle: "&e➌"
    - title: ""
      subtitle: "&e➋"
    - title: ""
      subtitle: "&e➊"
  final-title:
    - title: ""
      subtitle: "&e🏆 &6Fight &e🏆"
  disabled-commands:
    - '/duel'
    - '/p'
    - '/party'
    - '/openparty'
    - '/findparty'
    - '/parties'
    - '/sc'
    - '/flixcore'
    - '/ffa'
  sounds:
    countdown: "BLOCK_NOTE_BLOCK_PLING"
    countdown-volume: 1.0
    countdown-pitch: 1.0
    start: "BLOCK_NOTE_BLOCK_CHIME"
    start-volume: 1.0
    start-pitch: 1.0
    win: "ENTITY_PLAYER_LEVELUP"
    win-volume: 1.0
    win-pitch: 1.0
    lose: "ENTITY_VILLAGER_DEATH"
    lose-volume: 1.0
    lose-pitch: 1.0
  kill-death-title:
    enabled: true
    kill:
      title: 'You Killed'
      subtitle: '%player%'
      sound: ""
      sound-volume: 1.0
      sound-pitch: 1.0
    death:
      title: 'You Were Killed'
      subtitle: 'by %player%'
      sound: ""
      sound-volume: 1.0
      sound-pitch: 1.0
  teleport-back-on-outbound: true
  instant-kill-arena-outbound: false
  delay-kill-outbound:
    delay: 5
    actionbar: "&cReturn to arena in &e%time%s"
  leave-countdown:
    time: 3
    actionbar: "&cLeaving FFA in &e%time%s&c..."
    cancelled: "&cLeave cancelled"
    complete: "&aYou have left the FFA arena"
  random-ffa:
    enabled: false
    loot-drop: false  # default: false
    save-inventory: false  # Save player inventory on disconnect/leave, restore on rejoin
    arenas:
      examplearena:
        mode: "exclude"  # "include" = only these kits, "exclude" = all kits except these
        kits:
          - tiernodebuff
          - tiergapple
  combat:
    enabled: true
    duration: 15
    anti-interruption: true
    anti-interruption-ffa-arena:
      - arenas # Empty list = all arenas 
      - hello world  # Only these arenas have anti-interruption
      
    actionbar:
      enabled: true
      message: "&7You are in combat for &f%time%&7 seconds."

# Spectator Configuration
spectator:
  # Spectators are always mutually hidden while still seeing active fighters.
  hide-from-tab: false
  hide-cage-from-spectators: true
  spectator-gamemode: SURVIVAL
  spectator-teleport-distance: 150

# Team Settings
team-settings:
  red-team-icon: '&c[R] &c'
  red-team-color: '&c'
  blue-team-icon: '&9[B] &9'
  blue-team-color: '&9'
  # Enable/disable team glow outline in party split & party vs modes
  team-glow-enabled: true

# Placeholder Settings
placeholders:
  # Used when tier/rank placeholders would normally show "Unranked".
  # Supports legacy color codes and hex colors.
  unranked-tier-name: "&7Unranked"
  ping-colors:
    good: "<#B5F063>"
    mid: "<#E0D3A7>"
    bad: "<#FF5D5D>"
  ping-thresholds:
    good: 50
    mid: 100

# Bedwars Configuration
bedwars:
  reload-arrows: true
  reload-arrow-time: 5
  respawn-delay-seconds: 5
  spawn-protection-seconds: 0
  bed-break-sound: ENTITY_ENDER_DRAGON_GROWL
  bed-break-sound-volume: 1.0
  bed-break-sound-pitch: 1.0
  bed-break-title:
    - title: "&cYour bed has been destroyed!"
      subtitle: "&fYou will no longer respawn"

# Golden Head Configuration
#   The Golden Head is a PLAYER_HEAD with a custom texture that uses a real eating
#   animation and a per-item visual cooldown (via Paper data-components). The legacy
#   PIGLIN_HEAD material is still auto-migrated so old kits keep working.
golden-head:
  # Mojang texture URL (use any http://textures.minecraft.net/texture/... url).
  texture-url: "http://textures.minecraft.net/texture/aa0c0ff130897f404ece7e74896bc3b830bd3cba566c9e0f475fbd3fc8c769e4"
  display-name: "&6&lGolden Head"
  # Seconds the player holds right-click to finish eating (like vanilla food).
  consume-seconds: 1.6
  # Visual cooldown shown on the item slot after eating, in seconds.
  g-head-cooldown: 8
  message: "&fYou ate a &6Golden Head &fand Gained. &dRegeneration III &7(0:08) &f& &eAbsorption II &7(2:00)"
  ate-sound: "entity.generic.eat"
  ate-sound-volume: 1.0
  ate-sound-pitch: 1.0
  effects:
    - effect: "minecraft:absorption"
      duration: 120
      amplifier: 1
      has-particles: false
    - effect: "minecraft:regeneration"
      duration: 8
      amplifier: 2
      has-particles: false

tnt:
  source-damage: -1  # -1 = default TNT damage, 0 = no damage, positive = custom damage
  knockback:
    radius:
      x: 2
      y: 2
      z: 2
    multiplier: 1.5
    y-force: 1.5
  cooldown:
    enabled: true
    cooldown: 2
    rename-item: '&fCooldown: &e<time> &fseconds'

fireball:
  shooter-damage: 0
  knockback:
    radius:
      x: 2
      y: 2
      z: 2
    multiplier: 1.5
    y-force: 1.5
  cooldown:
    enabled: true
    cooldown: 2
    rename-item: '&fCooldown: &e<time> &fseconds'

tnt-tag:
  timer: 15
  actionbar-holder: "&c💣 You will be Exploded in: &f%time%s"
  actionbar-others: "&e💣 TNT Exploding in: &f%time%s &7| &c%holder%"
  sounds:
    # Configured values are the base; transfer/tick/explosion effects multiply them.
    tag: "ENTITY_ITEM_PICKUP"
    tag-volume: 1.0
    tag-pitch: 1.0
    tick: "BLOCK_NOTE_BLOCK_HAT"
    tick-volume: 1.0
    tick-pitch: 1.0
    explosion: "ENTITY_GENERIC_EXPLODE"
    explosion-volume: 1.0
    explosion-pitch: 1.0

flower-crown:
  timer: 20
  actionbar-holder: "&d🌸 Protect your Flower: &f%time%s"
  actionbar-others: "&e🌸 Protecting Timer: &f%time%s &7| &e%holder%"
  flower-item: "POPPY"
  sounds:
    # Configured values are the base; steal/tick effects multiply them.
    give: "ENTITY_ITEM_PICKUP"
    give-volume: 1.0
    give-pitch: 1.0
    steal: "ENTITY_EXPERIENCE_ORB_PICKUP"
    steal-volume: 1.0
    steal-pitch: 1.0
    tick: "BLOCK_NOTE_BLOCK_HARP"
    tick-volume: 1.0
    tick-pitch: 1.0
    win: "ENTITY_PLAYER_LEVELUP"
    win-volume: 1.0
    win-pitch: 1.0
    eliminate: "ENTITY_VILLAGER_NO"
    eliminate-volume: 1.0
    eliminate-pitch: 1.0

tnt-sumo:
  knockback:
    grounded:
      strength: 0.3
      y-force: 0.2
    airborne:
      strength: 1.5
      y-force: 0.8
    airborne-threshold: 0.5
  max-hits: 10
  block-break-time: 40

snowball:
  knockback:
    strength: 0.5
    y-force: 0.3

egg:
  knockback:
    strength: 0.5
    y-force: 0.3

kit-editor:
  auto-save-on-close: true
  # When true, reject layouts containing extra items. Set false to allow any
  # inventory contents globally. The per-kit custom-items rule always bypasses it.
  strict-layout-validation: true
  # Prevents kit-editor race exploits immediately after leaving FFA while async
  # lobby teleports / old pearls are still settling. Set 0 to disable.
  post-ffa-leave-edit-lock-ms: 5000
  shulker-box-editor:
    enabled: true

kit-rules:
  gapple-cooldown: 5
  god-apple-cooldown: 300
  enderpearl-cooldown: 16
  hearts:
    crystal: 20
    uhc: 10
    nodebuff: 10
  # Max fight duration per kit (only used when MAX_FIGHT_DURATION kit rule is enabled)
  # If not set, uses match.max-fight-duration
  max-fight-duration:
    bedwars: 300
    bridge: 180
  # Damage multiplier when DAMAGE_MULTIPLIER kit rule is enabled
  # default: applies to all kits unless kit-specific value is set
  # You can add kit-specific multipliers like: nodebuff: 1.5
  # kit-rules:
  #damage-multiplier:
  #  default: 2.0      # All kits use 2x
  #  nodebuff: 3.0     # nodebuff kit uses 3x
  #sumo: 1.5         # sumo kit uses 1.5x
  damage-multiplier:
    default: 2.0
  block-decay:
    decay-time: 6
    cascade:
      enabled: true
      delay: 3
  bridge-points:
    default: 5
  # HP Indicator — shows health below player nametag during matches.
  # Only active for kits that have the "hpindicator" rule enabled.
  hp-indicator:
    title: "&c❤"
    render-distance: 32        # blocks; controls how far we SEND packets (client only renders ~10-12 blocks)
    scope: both                # fighters | spectators | both
    update-interval: 2         # ticks between score refreshes (0 = every damage event only)

  # Lava Raise — enabled only for kits with the "lavaraise" rule.
  # Uses the arena corner1/corner2 region. Air blocks are changed to stationary
  # lava from the lowest Y layer upward, then restored when the round ends.
  lava-raise:
    enabled: true
    # Delay after the fight countdown ends before the first layer starts.
    start-delay-ticks: 100
    # Pause after one complete layer before beginning the next layer.
    layer-interval-ticks: 20
    # Maximum blocks changed per server tick to avoid large arena lag spikes.
    blocks-per-tick: 256

  # Pre-Potions — apply potion effects on match start / next round start.
  # Only active for kits that have the "prepotions" rule enabled.
  # sound: the sound to play when effects are applied (empty = no sound)
  # Format per kit:
  #   <kit-name>:
  #     - type: SPEED             # Bukkit PotionEffectType name
  #       amplifier: 1            # 0 = level I, 1 = level II, etc.
  #       duration: 600           # duration in ticks (20 ticks = 1 second, -1 = infinite)
  #       ambient: true           # show translucent particles
  #       particles: false        # show normal particles
  #       icon: true              # show icon on HUD
  #     - type: RESISTANCE
  #       amplifier: 0
  #       duration: -1
  # You can also define a "default" entry that applies to ALL kits with prepotions enabled.
  pre-potions:
    sound: "ENTITY_WITCH_DRINK"
    sound-volume: 1.0
    sound-pitch: 1.0
    # default:
    #   - type: SPEED
    #     amplifier: 1
    #     duration: 600
    #     ambient: true
    #     particles: false
    #     icon: true

party:
  countdown-time: 5
  # Lateral distance between teammates sharing an arena spawn.
  team-spawn-spacing: 1.5
  allow-imbalance: false
  imbalance-permission: "flixcore.party.imbalance"
  titles:
    - title: ""
      subtitle: "&c➌"
      pitch: 0.8
    - title: ""
      subtitle: "&e➋"
      pitch: 1.0
    - title: ""
      subtitle: "&a➊"
      pitch: 1.2
  final-title:
    - title: "&a&lFIGHT!"
      subtitle: ""
  economy:
    create-costs: false
    create-amount: 20
  party-gui: true
  default-max-size: 8
  ffa-spawn-radius: 5.0
  end-delay-seconds: 3
  invite-cooldown: 3000
  invite-expire-time: 60
  challenge-expire-time: 120
  broadcast:
    enabled: true
    # Auto-broadcast public parties whose "broadcast" toggle is enabled.
    # Runs asynchronously every 60 seconds by default.
    interval-seconds: 60
  # Legacy interval key kept for old configs. New installs should use party.broadcast.interval-seconds.
  broadcast-interval: 60
  broadcast-permission: "flixcore.party.broadcast"
  max-size-permissions:
    - permission: "flixcore.party.size.20"
      max-size: 20
    - permission: "flixcore.party.size.16"
      max-size: 16
    - permission: "flixcore.party.size.12"
      max-size: 12
  party-info:
    - '&eParty Info '
    - '&f'
    - ' &fLeader: &f<owner>'
    - ' &fMembers [<size>]: &f<members>'
  max-display-limit: 16
  limit-reached: '&eAnd <more_members> members more.'
  round-selection:
    enabled: false
    options:
      - 1
      - 3
      - 5
  partyffa-disabled-kits:
  - tank
  partysplit-disabled-kits:
  - tank
  partyvs-disabled-kits:
  - tank
  disabled-commands:
    - '/duel'
    - '/sc'
    - '/flixcore'
  sounds:
    countdown: "BLOCK_NOTE_BLOCK_PLING"
    countdown-volume: 1.0
    countdown-pitch: 1.0
    start: "BLOCK_NOTE_BLOCK_CHIME"
    start-volume: 1.0
    start-pitch: 1.0
    win: "ENTITY_PLAYER_LEVELUP"
    win-volume: 1.0
    win-pitch: 1.0
    eliminate: "ENTITY_VILLAGER_NO"
    eliminate-volume: 1.0
    eliminate-pitch: 1.0
  create:
    title: "&5&lPARTY CREATED"
    subtitle: "&dYou are now the party leader!"
    actionbar: "&aParty created successfully!"
    sound: "ENTITY_PLAYER_LEVELUP"
    sound-volume: 1.0
