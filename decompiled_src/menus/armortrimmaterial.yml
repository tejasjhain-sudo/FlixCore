click-sound:
  enabled: true
  sound: UI_BUTTON_CLICK
  volume: 1.0
  pitch: 1.0

# =====================================================================
# Armor Trim Material Menu
# =====================================================================
# Each material entry supports an optional `permission:` key. When a
# player does not have the permission they will see the locked
# display_name / lore_no_permission and the click is rejected.
#
# If `permission` is omitted (or empty) FlixCore will fall back to the
# default node:
#   flixcore.trim.material.<key>     (e.g. flixcore.trim.material.iron)
#
# Set it to an empty string ("") to disable the permission check entirely
# for that material.
# =====================================================================
gui:
  title: '&5&lSelect Trim Material'
  size: 27
  item-attributes:
    - HIDE_ADDITIONAL_TOOLTIP
    - HIDE_ATTRIBUTES

materials:
  quartz:
    material: QUARTZ
    slot: 10
    permission: 'flixcore.trim.material.quartz'
    display_name: '&f&lQuartz'
    lore:
      - ''
      - '&7White colored trim'
      - ''
      - '&eClick to select!'

