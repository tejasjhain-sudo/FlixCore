click-sound:
  enabled: true
  sound: UI_BUTTON_CLICK
  volume: 1.0
  pitch: 1.0

# =====================================================================
# Armor Trim Pattern Menu
# =====================================================================
# Each pattern entry supports an optional `permission:` key. When a player
# does not have the permission they will see the locked display_name /
# lore_no_permission and the click is rejected.
#
# If `permission` is omitted (or empty) FlixCore will fall back to the
# default node:
#     flixcore.trim.pattern.<key>     (e.g. flixcore.trim.pattern.coast)
#
# Set it to an empty string ("") to disable the permission check entirely
# for that pattern.
# =====================================================================
gui:
  title: '&5&lSelect Trim Pattern'
  size: 45
  item-attributes:
    - HIDE_ADDITIONAL_TOOLTIP
    - HIDE_ATTRIBUTES

patterns:
