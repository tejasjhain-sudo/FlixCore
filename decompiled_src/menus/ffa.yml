click-sound:
  enabled: true
  sound: UI_BUTTON_CLICK
  volume: 1.0
  pitch: 1.0

#####################################################################
# FFA GUI
# Opens with: /ffa or /ffa gui
# Reload with: /flixcore reload ffa
#
# This is ONE YAML file with multiple categories.
# Use [openmenu] <category> or [opencategory] <category> to switch views.
#
# Supported item keys:
# material, amount, slot, slots, display_name, lore, custom-model-data,
# glow, item_flags, enchantments, click_commands
#
# Supported commands:
# [sound] SOUND_NAME [volume] [pitch] (volume/pitch default to 1.0)
# [player] command without slash
# [console] command without slash
# [close]
# [openmenu] category_id
# [opencategory] category_id
#
# Joining FFA from GUI:
# [player] ffa join <arena> [position|-] [kit]
# Examples:
# [player] ffa join nethpot - nethpot
# [player] ffa join arena1 spawn1 builduhc
#
# Supports PlaceholderAPI and these built-in placeholders:
# %player%, %player_name%, %server_online%, %menu_category%
# %flixcore_ffa_players_<arena>%, %ffa_players_<arena>%
#####################################################################

menu_title: '&8FFA'
size: 27
update_interval: 1
default_category: early_game

# Applied to every item unless the item adds more flags.
item_flags:
  - HIDE_ATTRIBUTES
  - HIDE_ADDITIONAL_TOOLTIP

categories:
  early_game:
    title: '&8FFA &7- &aEarly Game'
    items:
      early_game:
        material: GOLDEN_APPLE
        slot: 2
        display_name: '&a&lEARLY GAME'
        item_flags:
          - HIDE_ENCHANTS
        enchantments:
