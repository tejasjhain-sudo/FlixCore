    type: toggle
    material: ITEM_FRAME
    slot: 12
    default: true
    display_name: '&bScoreboard'
    lore_enabled:
      - ''
      - '&7Status: %status_with_color%'
      - ''
      - '&7Scoreboard is visible'
      - ''
      - '&eClick to toggle'
    lore_disabled:
