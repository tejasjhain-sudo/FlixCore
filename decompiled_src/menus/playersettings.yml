click-sound:
  enabled: true
  sound: UI_BUTTON_CLICK
  volume: 1.0
  pitch: 1.0

#####################################################################
# Player Settings Menu
#
# Text formatting:
# - Supports MiniMessage tags in all GUI and dialog text:
#   <gradient>, <rainbow>, <hover>, <click>, <keybind>, <translatable>,
#   <font>, <sprite>, <head>, <shadow>, hex colors like <#55ff55>, etc.
# - Legacy color codes still work too: &a, &c, &#55ff55.
#
# Choose how /settings opens:
# settings.open-mode: gui     -> classic inventory GUI
# settings.open-mode: dialog  -> Paper dialog menu, falls back to GUI if unavailable
#
# Dialog support:
# - Cached from this file on reload.
# - Uses the same items below as the GUI.
# - Toggle, open_gui, close, and decoration item types are supported.
# - decoration items are not shown as dialog actions.
#
# Dialog placeholders:
# %player%, %player_name%, %setting_key%, %setting_name%,
# %sprite%, %status%, %status_text%, %status_color%, %status_symbol%,
# %status_with_color%
# PlaceholderAPI is also supported.
#
# Dialog layout/design:
# - Item buttons are shown in the same order as the "items:" section.
# - dialog.action-columns controls how many button columns Paper uses.
# - dialog.button-width controls default button width.
# - Each item can override width with items.<item>.dialog.width.
# - Each item can fully change its button text with items.<item>.dialog.text.
# - Each item can set items.<item>.dialog.sprite. If omitted, the item material
#   is used as the sprite. Use shorthand like diamond_sword, item/diamond_sword,
#   or the full <sprite:items:item/diamond_sword> tag.
# - Tooltip text can be one string or a YAML list of lines:
#     dialog:
#       tooltip_enabled:
#         - '&aLine 1'
#         - '&7Line 2'
#
# Per-item dialog keys:
# dialog.sprite
# dialog.text
# dialog.tooltip_enabled
# dialog.tooltip_disabled
# dialog.tooltip
# dialog.width
#
# Status text is fully editable in dialog.status below.
# Example: change "Enabled" to "ON", "Active", "Yes", etc.
# Set dialog.status.tooltip-line to '' if you do not want a separate
# status line at the top of each tooltip.
#####################################################################

settings:
  # gui or dialog
  open-mode: dialog

dialog:
  enabled: true
  title: '&6Player Settings'
  body:
    - '&7Manage your personal settings.'
    - '&7Click a button below to toggle or open a menu.'
  action-columns: 2
  button-width: 180
  status:
    tooltip-line: '%status_with_color%'
    enabled:
      text: 'ON'
      color: '&a'
      symbol: 'ON'
    disabled:
      text: 'OFF'
      color: '&c'
      symbol: 'OFF'
  close:
    text: '&cClose'
    tooltip: '&7Close settings.'

gui:
  title: '&6Player Settings'
  size: 45

