      - '&7Status: %status_with_color%'
      - ''
      - '&7Scoreboard is hidden'
      - ''
      - '&eClick to toggle'
    on_command: ''
    off_command: ''
    toggle_message: '&7Scoreboard: {status}'
    dialog:
      sprite: item_frame
      text: '%sprite% &fScoreboard &7➥ %status_color%%status%'
