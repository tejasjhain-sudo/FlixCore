click-sound:
  enabled: true
  sound: UI_BUTTON_CLICK
  volume: 1.0
  pitch: 1.0

gui:
  title: '&5&lSelect Pattern'
  size: 54
  item-attributes:
    - HIDE_ADDITIONAL_TOOLTIP
    - HIDE_ATTRIBUTES
    - HIDE_DESTROYS
    - HIDE_PLACED_ON

# Reusable pattern item template. Supports %color%, %color_key%, %pattern%,
# %background_color%, %background_color_key%, and optional custom-model-data.
# Generated color/pattern combinations are cached until plugin reload.
items:
  pattern:
    material: '%background_color_key%_BANNER'
    display_name: '&e&l%pattern%'
    lore:
      - ''
      - '&7Color: &e%color%'
      - '&7Pattern: &e%pattern%'
      - ''
      - '&e\u25B6 CLICK to Add as Layer'

# Patterns are enumerated dynamically from the server's banner-pattern registry and
# placed in the slots below in order. Pages of patterns will be paginated through
# the next/prev buttons.
pattern_slots: [10, 11, 12, 13, 14, 15, 16, 19, 20, 21, 22, 23, 24, 25, 28, 29, 30, 31, 32, 33, 34, 37, 38, 39, 40, 41, 42, 43]

buttons:
  back:
    material: REDSTONE
    slot: 49
    display_name: '&c&l\u00D7 BACK'
    lore:
      - ''
      - '&7Return to the shield editor.'
      - ''
      - '&e\u25B6 CLICK to Go Back'

  prev_page:
    material: ARROW
    slot: 48
    display_name: '&e&l\u25C0 PREVIOUS PAGE'
    lore:
      - ''
      - '&7Page: &e%page%/%total_pages%'
      - ''

  next_page:
    material: ARROW
    slot: 50
    display_name: '&e&lNEXT PAGE \u25B6'
    lore:
      - ''
      - '&7Page: &e%page%/%total_pages%'
      - ''
