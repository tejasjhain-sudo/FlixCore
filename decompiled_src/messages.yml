  # ───────────────────────────────────────────────────────────────────────────
  # Friends system
  # All friend.* messages may be set to "" (empty quotes) to skip silently.
  # The &f%prefix%&7 placeholder is replaced with friend.prefix below.
  # ───────────────────────────────────────────────────────────────────────────
  friend:
    prefix: '&b&l FRIENDS &7➡'

    request-sent: '&f%prefix%&7 Friend request sent to &f%target%&7'
    request-received: '&f%prefix%&7 &f%sender%&7 sent you a friend request! Type &f/f accept &f%sender%&7'
    request-already-friends: '&f%prefix%&7 &cYou are already friends with &f%target%&7'
    request-already-pending: '&f%prefix%&7 &cYou already have a pending request to &f%target%&7'
    request-self: '&f%prefix%&7 &cYou cannot friend yourself'
    request-blocked: '&f%prefix%&7 &f%target%&7 is not accepting friend requests right now'
    request-no-such: '&f%prefix%&7 &cNo incoming request from &f%sender%&7'
    request-accepted-self: '&f%prefix%&7 &aYou and &f%target%&7 &aare now friends'
    request-accepted-target: '&f%prefix%&7 &f%player%&7 &aaccepted your friend request'
    request-denied: '&f%prefix%&7 Denied request from &f%target%&7'

    removed: '&f%prefix%&7 Removed &f%target%&7 from your friends'
    not-a-friend: '&f%prefix%&7 &f%target%&7 is not on your friends list'
    player-not-found: '&f%prefix%&7 &cPlayer &f%target%&7 &cnot found'

    notifications-enabled: '&f%prefix%&7 &aFriend join/quit alerts: &aEnabled'
    notifications-disabled: '&f%prefix%&7 &cFriend join/quit alerts: &cDisabled'
    requests-enabled: '&f%prefix%&7 &aIncoming requests: &aEnabled'
    requests-disabled: '&f%prefix%&7 &cIncoming requests: &cDisabled'

    notify-join: '&f%prefix%&7 &f%player%&7 joined the server'
    notify-quit: '&f%prefix%&7 &f%player%&7 left the server'

    list-header: '&f%prefix%&7 Your friends (&f%count%&7):'
    list-entry-online: '  &a● &f%player%&7'
    list-entry-offline: '  &c● &f%player%&7'
    list-empty: '&f%prefix%&7 You have no friends yet. Use &f/f add <player>'

    usage-add: '&f%prefix%&7 &cUsage: /f add <player>'
    usage-remove: '&f%prefix%&7 &cUsage: /f remove <player>'
    usage-accept: '&f%prefix%&7 &cUsage: /f accept <player>'
    usage-deny: '&f%prefix%&7 &cUsage: /f deny <player>'
    usage-message: '&f%prefix%&7 &cUsage: /f message <player> <message>'
    messaging-cross-server-only: '&f%prefix%&7 &cNetwork friend messaging is not enabled'
    not-friends: '&f%prefix%&7 &cYou are not friends with &f%target%'
    target-offline: '&f%prefix%&7 &f%target%&7 is offline'
    message-sent: '&d[MSG] &fYou &7→ &f%player%&7: &f%message%'

    help:
      - ''
      - '&f%prefix%&7 Friend Commands'
      - '  &f/f add <player> &7- Send a friend request'
      - '  &f/f accept <player> &7- Accept a request'
      - '  &f/f deny <player> &7- Deny a request'
      - '  &f/f remove <player> &7- Remove a friend'
      - '  &f/f list &7- Show your friends'
      - '  &f/f message <player> <message> &7- Message an online friend'
      - '  &f/f toggle-notifications &7- Toggle join/quit alerts'
      - '  &f/f toggle-requests &7- Toggle incoming requests'
      - ''

    # Display formats consumed by the swiftcore PlaceholderAPI placeholders.
    # Customizing these changes how friend status / toggle states render in tab,
    # scoreboard, GUIs, and any /papi parse output.
    display:
      online: '&aOnline'
      offline: '&cOffline'
      online-raw: 'online'
      offline-raw: 'offline'
      enabled: '&aEnabled'
      disabled: '&cDisabled'
      enabled-raw: 'enabled'
      disabled-raw: 'disabled'
      # Friend list rendering (used by &f%flixcore_friend_list%&7 / &f%flixcore_friend_list_inline%&7)
      empty-list: '&7No friends yet'
      entry-online: '&a● &f%name%&7'
      entry-offline: '&c● &f%name%&7'
      max-list-size: 10

