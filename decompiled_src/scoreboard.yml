  # MiniMessage tag. Atlas sprite example (Minecraft 1.21.9+):
  # '<sprite:"minecraft:items":"minecraft:item/diamond_sword">'
  # Other examples: '<gradient:red:gold>Text</gradient>', '<font:minecraft:default>'.
  # Custom HeadDatabase/base64 head:
  # '<head_database:eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6...>'
  # Player head: '<head:PlayerName>'
  # PlaceholderAPI values may also return either head tag.
  enabled: true
  update-interval: 20
  title: '%animation:flixcore%'
  shadow: true
  shadow-color: '#000000FF'
  hide-numbers: true

