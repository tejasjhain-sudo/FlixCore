      # Visual-only tournament tab rows.
      enabled: false
      blank-rows: 1
      ping: 1
      blank: " "
      lines:
        - "&#00E5FF&lTournament &#7F7F7F(%players%)"

global:
  enable: false
  enable-worlds:
    - world1
    - world2
  header:
    - ""
    - "%animation:flixcore%"
    - ""
  footer:
    - ""
    - "&#AAAAAAKills: &#FFFFF0%flixcore_kills%        &#AAAAAADeaths: &#FFFFF0%flixcore_deaths%        &#AAAAAAStore: &#00E5FF/store"
    - "&#00E5FFplay.flixcore.net"
    - ""
